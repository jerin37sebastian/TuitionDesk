<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TuitionDesk — Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; padding:24px 20px; min-height:100vh; padding-bottom:24px; }
    .wrap { width:100%; max-width:400px; }
    .login-logo { text-align:center; margin-bottom:28px; }
    .login-logo .icon { width:56px; height:56px; background:var(--blue); border-radius:16px; display:inline-flex; align-items:center; justify-content:center; font-size:26px; margin-bottom:10px; }
    .login-logo h1 { font-size:22px; font-weight:700; color:var(--blue); }
    .login-logo p { font-size:13px; color:var(--muted); margin-top:3px; }
    .card { background:var(--white); border-radius:16px; border:1px solid var(--border); padding:24px; }
    .card h2 { font-size:17px; font-weight:700; margin-bottom:4px; }
    .card .sub { font-size:13px; color:var(--muted); margin-bottom:20px; }
    .step { display:none; }
    .step.active { display:block; }
    .error-msg { background:var(--red-light); color:var(--red); font-size:13px; padding:10px 14px; border-radius:8px; margin-bottom:14px; display:none; }
    .switch-link { font-size:13px; color:var(--muted); text-align:center; margin-top:16px; }
    .switch-link a { color:var(--blue); font-weight:600; text-decoration:none; }
    .step-indicator { display:flex; gap:6px; margin-bottom:20px; }
    .step-dot { flex:1; height:4px; border-radius:4px; background:var(--border); }
    .step-dot.done { background:var(--blue); }
    .btn-loading { opacity:0.7; pointer-events:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="login-logo">
      <div class="icon">📚</div>
      <h1>TuitionDesk</h1>
      <p>Create your free account</p>
    </div>
    <div class="card">
      <div class="step-indicator">
        <div class="step-dot done" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <!-- STEP 1: Account -->
      <div class="step active" id="step1">
        <h2>Create account</h2>
        <p class="sub">Step 1 of 2 — Your login details</p>
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="name" placeholder="e.g. Suresh Kumar"/>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Min. 6 characters"/>
        </div>
        <button class="btn btn-primary" id="continueBtn">Continue →</button>
        <p class="switch-link">Already have an account? <a href="login.html">Sign in</a></p>
      </div>

      <!-- STEP 2: Center info -->
      <div class="step" id="step2">
        <h2>Your tuition center</h2>
        <p class="sub">Step 2 of 2 — Tell us about your center</p>
        <div class="form-group">
          <label>Center Name</label>
          <input type="text" id="centerName" placeholder="e.g. Bright Future Tuition"/>
        </div>
        <div class="form-group">
          <label>City / Town</label>
          <input type="text" id="city" placeholder="e.g. Thodupuzha"/>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="phone" placeholder="9876543210"/>
        </div>
        <button class="btn btn-primary" id="signupBtn">Create Account 🎉</button>
        <p class="switch-link"><a href="#" id="backBtn">← Back</a></p>
      </div>

    </div>
  </div>

  <script type="module">
    import { auth, db } from './js/firebase.js';
    import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

    document.getElementById('continueBtn').addEventListener('click', goStep2);
    document.getElementById('backBtn').addEventListener('click', goBack);
    document.getElementById('signupBtn').addEventListener('click', doSignup);

    function goStep2() {
      const name  = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('password').value;
      if (!name || !email || !pass) { showError('Please fill in all fields.'); return; }
      if (pass.length < 6)          { showError('Password must be at least 6 characters.'); return; }
      hideError();
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
      document.getElementById('dot2').classList.add('done');
    }

    function goBack() {
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step1').classList.add('active');
      document.getElementById('dot2').classList.remove('done');
    }

    async function doSignup() {
      const name       = document.getElementById('name').value.trim();
      const email      = document.getElementById('email').value.trim();
      const pass       = document.getElementById('password').value;
      const centerName = document.getElementById('centerName').value.trim();
      const city       = document.getElementById('city').value.trim();
      const phone      = document.getElementById('phone').value.trim();

      if (!centerName || !city) { showError('Please fill in center details.'); return; }

      const btn = document.getElementById('signupBtn');
      btn.textContent = 'Creating account...';
      btn.classList.add('btn-loading');

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });

        // Save center info to Firestore
        await setDoc(doc(db, 'centers', cred.user.uid), {
          ownerName: name,
          email,
          centerName,
          city,
          phone,
          plan: 'free',
          studentCount: 0,
          createdAt: serverTimestamp()
        });

        window.location.href = 'dashboard.html';
      } catch(e) {
        btn.textContent = 'Create Account 🎉';
        btn.classList.remove('btn-loading');
        if (e.code === 'auth/email-already-in-use') {
          showError('This email is already registered. Try logging in.');
        } else {
          showError('Something went wrong. Please try again.');
        }
      }
    }

    function showError(msg) {
      const err = document.getElementById('errorMsg');
      err.textContent = msg;
      err.style.display = 'block';
    }
    function hideError() {
      document.getElementById('errorMsg').style.display = 'none';
    }
  </script>
</body>
</html>
