<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TuitionDesk — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; padding:24px 20px; min-height:100vh; padding-bottom:24px; }
    .login-wrap { width:100%; max-width:400px; }
    .login-logo { text-align:center; margin-bottom:32px; }
    .login-logo .icon { width:60px; height:60px; background:var(--blue); border-radius:18px; display:inline-flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:12px; }
    .login-logo h1 { font-size:24px; font-weight:700; color:var(--blue); }
    .login-logo p { font-size:13px; color:var(--muted); margin-top:4px; }
    .login-card { background:var(--white); border-radius:16px; border:1px solid var(--border); padding:24px; }
    .login-card h2 { font-size:18px; font-weight:700; margin-bottom:4px; }
    .login-card .sub { font-size:13px; color:var(--muted); margin-bottom:22px; }
    .error-msg { background:var(--red-light); color:var(--red); font-size:13px; padding:10px 14px; border-radius:8px; margin-bottom:14px; display:none; }
    .switch-link { font-size:13px; color:var(--muted); text-align:center; margin-top:16px; }
    .switch-link a { color:var(--blue); font-weight:600; text-decoration:none; }
    .btn-loading { opacity:0.7; pointer-events:none; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <div class="icon">📚</div>
      <h1>TuitionDesk</h1>
      <p>Welcome back!</p>
    </div>
    <div class="login-card">
      <h2>Sign in 👋</h2>
      <p class="sub">Enter your credentials to continue</p>
      <div class="error-msg" id="errorMsg"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary" id="loginBtn">Sign In</button>
      <p class="switch-link">Don't have an account? <a href="signup.html">Sign up free</a></p>
    </div>
  </div>

  <script type="module">
    import { auth } from './js/firebase.js';
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js";

    // If already logged in, redirect
    onAuthStateChanged(auth, user => {
      if (user) window.location.href = 'dashboard.html';
    });

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('password').value;
      const btn   = document.getElementById('loginBtn');
      const err   = document.getElementById('errorMsg');

      if (!email || !pass) { showError('Please fill in all fields.'); return; }

      btn.textContent = 'Signing in...';
      btn.classList.add('btn-loading');

      try {
        await signInWithEmailAndPassword(auth, email, pass);
        window.location.href = 'dashboard.html';
      } catch (e) {
        btn.textContent = 'Sign In';
        btn.classList.remove('btn-loading');
        if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
          showError('Incorrect email or password.');
        } else if (e.code === 'auth/too-many-requests') {
          showError('Too many attempts. Please try again later.');
        } else {
          showError('Something went wrong. Please try again.');
        }
      }
    }

    function showError(msg) {
      const err = document.getElementById('errorMsg');
      err.textContent = msg;
      err.style.display = 'block';
      setTimeout(() => err.style.display = 'none', 4000);
    }

    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
