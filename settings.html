<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TuitionDesk — Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .profile-card { background:var(--white); border:1px solid var(--border); border-radius:16px; padding:24px; text-align:center; margin-bottom:16px; }
    .profile-avatar { width:64px; height:64px; border-radius:50%; background:var(--blue-light); color:var(--blue); font-size:24px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; margin-bottom:12px; }
    .profile-name { font-size:18px; font-weight:700; }
    .profile-center { font-size:13px; color:var(--muted); margin-top:4px; }
    .plan-pill { display:inline-block; margin-top:10px; padding:4px 14px; border-radius:20px; font-size:12px; font-weight:700; }
    .plan-free { background:var(--blue-light); color:var(--blue); }
    .plan-pro  { background:#fef9c3; color:#92400e; }
    .settings-item { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
    .settings-item .left { display:flex; align-items:center; gap:12px; font-size:15px; font-weight:500; }
    .settings-item .icon { font-size:20px; }
    .settings-item .arrow { color:var(--muted); }
    .danger { color:var(--red) !important; }
    .upgrade-card { background:linear-gradient(135deg,#2563eb,#7c3aed); border-radius:16px; padding:20px; margin-bottom:16px; color:white; }
    .upgrade-card h3 { font-size:16px; font-weight:700; margin-bottom:6px; }
    .upgrade-card p { font-size:13px; opacity:0.85; margin-bottom:14px; }
    .btn-upgrade { background:white; color:var(--blue); padding:10px 20px; border-radius:10px; font-size:14px; font-weight:700; border:none; cursor:pointer; font-family:'Outfit',sans-serif; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-title">Settings</div>
  </div>

  <div class="page">

    <div class="profile-card">
      <div class="profile-avatar" id="avatarEl">—</div>
      <div class="profile-name" id="nameEl">Loading...</div>
      <div class="profile-center" id="centerEl">—</div>
      <div class="plan-pill plan-free" id="planEl">Free Plan</div>
    </div>

    <!-- Upgrade card (shown only on free plan) -->
    <div class="upgrade-card" id="upgradeCard" style="display:none">
      <h3>⭐ Upgrade to Pro</h3>
      <p>Unlimited students, reports, parent reminders and more for just ₹399/month.</p>
      <button class="btn-upgrade">Upgrade Now</button>
    </div>

    <div class="section-title">Account</div>

    <div class="settings-item">
      <div class="left"><span class="icon">🏫</span> Center Name</div>
      <span class="arrow" id="centerNameEl">—</span>
    </div>
    <div class="settings-item">
      <div class="left"><span class="icon">📧</span> Email</div>
      <span class="arrow" id="emailEl" style="font-size:13px;color:var(--muted)">—</span>
    </div>
    <div class="settings-item">
      <div class="left"><span class="icon">📍</span> City</div>
      <span class="arrow" id="cityEl">—</span>
    </div>

    <div class="section-title" style="margin-top:16px">Support</div>
    <div class="settings-item">
      <div class="left"><span class="icon">💬</span> Contact Support</div>
      <span class="arrow">→</span>
    </div>
    <div class="settings-item">
      <div class="left"><span class="icon">📄</span> Privacy Policy</div>
      <span class="arrow">→</span>
    </div>

    <div class="section-title" style="margin-top:16px">Account Actions</div>
    <div class="settings-item" onclick="doLogout()">
      <div class="left danger"><span class="icon">🚪</span> Sign Out</div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Home
    </a>
    <a href="students.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/></svg>
      Students
    </a>
    <a href="attendance.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Attendance
    </a>
    <a href="fees.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Fees
    </a>
  </nav>

  <script type="module">
    import { auth, db } from './js/firebase.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.href = 'login.html'; return; }

      document.getElementById('emailEl').textContent = user.email;

      const snap = await getDoc(doc(db, 'centers', user.uid));
      if (snap.exists()) {
        const c = snap.data();
        const initials = (c.ownerName||'').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) || '?';
        document.getElementById('avatarEl').textContent    = initials;
        document.getElementById('nameEl').textContent      = c.ownerName || '—';
        document.getElementById('centerEl').textContent    = c.centerName || '—';
        document.getElementById('centerNameEl').textContent= c.centerName || '—';
        document.getElementById('cityEl').textContent      = c.city || '—';

        const plan = c.plan || 'free';
        const planEl = document.getElementById('planEl');
        if (plan === 'pro') {
          planEl.textContent = '⭐ Pro Plan';
          planEl.className   = 'plan-pill plan-pro';
        } else {
          document.getElementById('upgradeCard').style.display = 'block';
        }
      }
    });

    window.doLogout = async function() {
      if (!confirm('Sign out?')) return;
      await signOut(auth);
      window.location.href = 'login.html';
    };
  </script>
</body>
</html>
