<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TuitionDesk — Fees</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .fee-summary { display:flex; gap:10px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px; }
    .fee-summary::-webkit-scrollbar { display:none; }
    .fee-sum-card { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:12px 16px; flex-shrink:0; min-width:110px; }
    .fee-sum-card .label { font-size:11px; color:var(--muted); margin-bottom:4px; }
    .fee-sum-card .val   { font-size:20px; font-weight:700; }
    .toast { position:fixed; bottom:calc(var(--nav-h)+16px); left:50%; transform:translateX(-50%); background:#1e293b; color:white; padding:10px 20px; border-radius:20px; font-size:13px; font-weight:500; opacity:0; transition:opacity 0.3s; pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-title">Fee Tracking</div>
    <button class="fab" id="addFeeBtn" style="font-size:14px;width:auto;padding:0 12px;">+ Add</button>
  </div>

  <div class="page">
    <div class="fee-summary">
      <div class="fee-sum-card"><div class="label">Total</div><div class="val" id="totalAmt">₹—</div></div>
      <div class="fee-sum-card"><div class="label" style="color:var(--green)">Collected</div><div class="val" style="color:var(--green)" id="paidAmt">₹—</div></div>
      <div class="fee-sum-card"><div class="label" style="color:var(--red)">Pending</div><div class="val" style="color:var(--red)" id="pendAmt">₹—</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="filter('all',this)">All</button>
      <button class="tab" onclick="filter('paid',this)">Paid</button>
      <button class="tab" onclick="filter('pending',this)">Pending</button>
      <button class="tab" onclick="filter('partial',this)">Partial</button>
    </div>

    <div id="feeList"><div style="color:var(--muted);font-size:14px;text-align:center;padding:30px">Loading...</div></div>
  </div>

  <!-- ADD FEE MODAL -->
  <div class="modal-overlay" id="feeModal">
    <div class="modal">
      <div class="modal-title">Add Fee Record</div>
      <div class="form-group">
        <label>Student</label>
        <select id="feeStudent"></select>
      </div>
      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="feeAmount" placeholder="e.g. 1500"/>
      </div>
      <div class="form-group">
        <label>Month</label>
        <input type="month" id="feeMonth"/>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="feeStatus">
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="partial">Partial</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-outline" id="cancelFee">Cancel</button>
        <button class="btn btn-primary" style="flex:1" id="saveFeeBtn">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Home
    </a>
    <a href="students.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/></svg>
      Students
    </a>
    <a href="attendance.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Attendance
    </a>
    <a href="fees.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Fees
    </a>
  </nav>

  <script type="module">
    import { auth, db } from './js/firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js";
    import { collection, query, where, getDocs, addDoc, updateDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

    let uid = null;
    let students = [];
    let fees = [];
    let currentFilter = 'all';

    const feeModal  = document.getElementById('feeModal');
    document.getElementById('addFeeBtn').onclick  = () => feeModal.classList.add('open');
    document.getElementById('cancelFee').onclick  = () => feeModal.classList.remove('open');
    feeModal.addEventListener('click', e => { if(e.target===feeModal) feeModal.classList.remove('open'); });

    // Set default month to current
    const now = new Date();
    document.getElementById('feeMonth').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function badgeFor(status) {
      if (status==='paid')    return '<span class="badge badge-green">✅ Paid</span>';
      if (status==='pending') return '<span class="badge badge-red">⚠️ Pending</span>';
      return '<span class="badge badge-yellow">🔸 Partial</span>';
    }

    function updateSummary() {
      const total   = fees.reduce((s,f) => s+f.amount, 0);
      const paid    = fees.filter(f=>f.status==='paid').reduce((s,f)=>s+f.amount,0);
      const pending = fees.filter(f=>f.status!=='paid').reduce((s,f)=>s+f.amount,0);
      document.getElementById('totalAmt').textContent = `₹${total.toLocaleString('en-IN')}`;
      document.getElementById('paidAmt').textContent  = `₹${paid.toLocaleString('en-IN')}`;
      document.getElementById('pendAmt').textContent  = `₹${pending.toLocaleString('en-IN')}`;
    }

    function applyFilter() {
      const list = currentFilter === 'all' ? fees : fees.filter(f => f.status === currentFilter);
      const el = document.getElementById('feeList');
      if (list.length === 0) { el.innerHTML = '<div class="empty">No records found.</div>'; return; }
      el.innerHTML = list.map(f => {
        const s = students.find(x => x.id === f.studentId);
        if (!s) return '';
        const initials = s.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
        const monthLabel = f.monthKey ? new Date(f.monthKey+'-01').toLocaleDateString('en-IN',{month:'long',year:'numeric'}) : f.monthKey;
        return `
          <div class="fee-card">
            <div class="left">
              <div class="avatar">${initials}</div>
              <div class="fee-info">
                <div class="name">${s.name}</div>
                <div class="meta">${monthLabel} · ${s.class||''}</div>
              </div>
            </div>
            <div class="right">
              <div class="amount">₹${f.amount.toLocaleString('en-IN')}</div>
              <div style="margin-top:4px">${badgeFor(f.status)}</div>
              ${f.status !== 'paid'
                ? `<button onclick="markPaid('${f.id}')" style="margin-top:6px;padding:5px 12px;background:var(--blue);color:white;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:Outfit,sans-serif">Mark Paid</button>`
                : ''}
            </div>
          </div>`;
      }).join('');
    }

    window.filter = function(type, el) {
      currentFilter = type;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      applyFilter();
    };

    window.markPaid = async function(id) {
      await updateDoc(doc(db, 'fees', id), { status: 'paid' });
      fees = fees.map(f => f.id === id ? { ...f, status: 'paid' } : f);
      updateSummary();
      applyFilter();
      showToast('✅ Marked as paid!');
    };

    document.getElementById('saveFeeBtn').onclick = async () => {
      const studentId = document.getElementById('feeStudent').value;
      const amount    = parseInt(document.getElementById('feeAmount').value);
      const monthKey  = document.getElementById('feeMonth').value;
      const status    = document.getElementById('feeStatus').value;
      if (!studentId || !amount || !monthKey) { alert('Please fill all fields.'); return; }

      document.getElementById('saveFeeBtn').textContent = 'Saving...';
      const ref = await addDoc(collection(db, 'fees'), { studentId, amount, monthKey, status, centerId: uid, createdAt: serverTimestamp() });
      fees.push({ id: ref.id, studentId, amount, monthKey, status });
      updateSummary();
      applyFilter();
      feeModal.classList.remove('open');
      document.getElementById('saveFeeBtn').textContent = 'Save';
      showToast('Fee record added!');
    };

    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.href = 'login.html'; return; }
      uid = user.uid;

      // Load students
      const sSnap = await getDocs(query(collection(db, 'students'), where('centerId','==',uid)));
      students = [];
      sSnap.forEach(d => students.push({ id: d.id, ...d.data() }));

      // Populate student dropdown
      const sel = document.getElementById('feeStudent');
      sel.innerHTML = students.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

      // Load fees
      const fSnap = await getDocs(query(collection(db, 'fees'), where('centerId','==',uid)));
      fees = [];
      fSnap.forEach(d => fees.push({ id: d.id, ...d.data() }));

      updateSummary();
      applyFilter();
    });
  </script>
</body>
</html>
